name: Farmácias da Receita
on:
  schedule:
    - cron: "0 7 20 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cnpj:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: python3 receita.py
      - run: |
          git config user.name "robo-farmacias"
          git config user.email "robo-farmacias@users.noreply.github.com"
          git add farmacias_cnpj.csv
          git diff --cached --quiet || (git commit -m "Farmácias da Receita" && git pull --rebase && git push)
