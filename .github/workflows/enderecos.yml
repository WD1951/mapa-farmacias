name: Endereços em pontos

on:
  schedule:
    - cron: "0 7 21 * *"   # dia 21, depois do robô da Receita (dia 20)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enderecos:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Converter endereços em coordenadas
        run: python3 enderecos.py

      - name: Guardar no repositório (mesmo se parar no meio)
        if: always()
        run: |
          git config user.name "robo-farmacias"
          git config user.email "robo-farmacias@users.noreply.github.com"
          git add enderecos_cache.csv farmacias_receita.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Endereços em pontos" && git pull --rebase && git push)
