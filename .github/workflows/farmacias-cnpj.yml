name: Farmácias da base CNPJ

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install requests

      - name: Extrair farmácias de SP
        run: python farmacias_cnpj.py

      - name: Salvar resultado no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dados/farmacias_sp.csv
          git commit -m "Atualiza farmácias da base CNPJ" || echo "Sem mudanças"
          git push
