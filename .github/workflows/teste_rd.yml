name: Teste Drogasil e Raia

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python teste_rd.py
      - uses: actions/upload-artifact@v4
        with:
          name: paginas-rd
          path: saida/
