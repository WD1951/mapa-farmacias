name: Teste preços das redes

on:
  workflow_dispatch:   # só roda quando você aperta o botão

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Consultar a cesta de teste
        shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python teste_redes.py | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
