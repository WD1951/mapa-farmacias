<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de farmácias — Medicamentos Baratos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#eef1f3; --painel:#ffffff; --tinta:#16232e; --suave:#5b6a76; --linha:#d5dce1;
  --indep:#0f8a6b; --rede:#8b97a1; --raio:#16232e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#10171d; --painel:#18222a; --tinta:#e6edf1; --suave:#93a3ae; --linha:#2a3742;
         --indep:#35c39b; --rede:#6d7c87; --raio:#e6edf1; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tinta);font-family:"Archivo",system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{padding:14px 18px 10px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{font-size:1.35rem;font-weight:800;margin:0;letter-spacing:-.01em}
.sub{color:var(--suave);font-size:.9rem;margin-top:2px}
.raios{display:flex;gap:6px}
.raios button{font:inherit;font-size:.95rem;padding:8px 14px;border-radius:999px;border:1px solid var(--linha);
  background:var(--painel);color:var(--tinta);cursor:pointer}
.raios button[aria-pressed="true"]{background:var(--tinta);color:var(--painel);border-color:var(--tinta)}
main{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0}
#mapa{min-height:300px}
aside{background:var(--painel);border-left:1px solid var(--linha);display:flex;flex-direction:column;min-height:0}
.contas{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--linha)}
.conta{padding:14px 12px}
.conta b{display:block;font-size:1.8rem;font-weight:800;line-height:1}
.conta span{font-size:.82rem;color:var(--suave)}
.conta.i b{color:var(--indep)}
#estado{padding:10px 14px;font-size:.88rem;color:var(--suave);border-bottom:1px solid var(--linha)}
ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1;padding-bottom:env(safe-area-inset-bottom,0px)}
li{padding:10px 14px;border-bottom:1px solid var(--linha);cursor:pointer;display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:start}
li:hover,li:focus{background:var(--bg);outline:none}
.pt{width:10px;height:10px;border-radius:50%;margin-top:5px}
.nome{font-weight:600;font-size:.95rem}
.end{font-size:.8rem;color:var(--suave)}
.dist{font-size:.85rem;color:var(--suave);white-space:nowrap}
.dica{font-size:.8rem;color:var(--suave);padding:8px 14px}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:55vh auto}
  aside{border-left:0;border-top:1px solid var(--linha)}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Farmácias ao redor</h1>
    <div class="sub">Toque no mapa para mudar o centro. Dados: OpenStreetMap.</div>
  </div>
  <div class="raios" role="group" aria-label="Raio">
    <button data-r="500">500 m</button>
    <button data-r="1000" aria-pressed="true">1 km</button>
    <button data-r="2000">2 km</button>
  </div>
</header>
<main>
  <div id="mapa"></div>
  <aside>
    <div class="contas">
      <div class="conta"><b id="cTotal">–</b><span>no raio</span></div>
      <div class="conta i"><b id="cIndep">–</b><span>independentes</span></div>
      <div class="conta"><b id="cRede">–</b><span>de rede</span></div>
    </div>
    <div id="estado">Carregando…</div>
    <ul id="lista"></ul>
    <div class="dica">Rede = nome reconhecido de rede grande. O resto conta como independente.</div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Centro inicial: Alameda Santos, Jardins
let centro = [-23.5668, -46.6530];
let raio = 1000;

const REDES = ["drogasil","droga raia","raia","drogaria são paulo","drogaria sao paulo","pacheco",
  "pague menos","ultrafarma","onofre","panvel","extrafarma","drogarias dsp","farmais","drogaria iguatemi",
  "nissei","venancio","araujo","drogal","farmácias app","poupafarma"];

function ehRede(t){
  const s = ((t.brand||"")+" "+(t.name||"")+" "+(t.operator||"")).toLowerCase();
  return REDES.some(r => s.includes(r));
}

const escuro = matchMedia("(prefers-color-scheme: dark)").matches;
const mapa = L.map("mapa",{zoomControl:true}).setView(centro, 15);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19, attribution:'&copy; OpenStreetMap'
}).addTo(mapa);

const camada = L.layerGroup().addTo(mapa);
let circulo, alvo;
const cor = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const SERVIDORES = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
];

async function buscar(){
  document.getElementById("estado").textContent = "Buscando farmácias…";
  const [lat,lon] = centro;
  const q = `[out:json][timeout:25];(node["amenity"="pharmacy"](around:${raio},${lat},${lon});way["amenity"="pharmacy"](around:${raio},${lat},${lon}););out center tags;`;
  for (const url of SERVIDORES){
    try{
      const ctl = new AbortController();
      const t = setTimeout(()=>ctl.abort(), 20000);
      const r = await fetch(url+"?data="+encodeURIComponent(q),{signal:ctl.signal});
      clearTimeout(t);
      if(!r.ok) continue;
      const d = await r.json();
      if(Array.isArray(d.elements)) return d.elements;
    }catch(e){}
  }
  throw new Error("sem resposta");
}

function distancia(a,b){
  const R=6371000, rad=x=>x*Math.PI/180;
  const dLat=rad(b[0]-a[0]), dLon=rad(b[1]-a[1]);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

async function atualizar(){
  camada.clearLayers();
  if(circulo) mapa.removeLayer(circulo);
  if(alvo) mapa.removeLayer(alvo);
  circulo = L.circle(centro,{radius:raio,color:cor("--raio"),weight:1,fillOpacity:.04,dashArray:"4 4"}).addTo(mapa);
  alvo = L.circleMarker(centro,{radius:5,color:cor("--raio"),fillColor:cor("--raio"),fillOpacity:1}).addTo(mapa);
  mapa.fitBounds(circulo.getBounds(),{padding:[10,10]});

  let itens;
  try{ itens = await buscar(); }
  catch(e){ document.getElementById("estado").textContent = "O servidor do OpenStreetMap não respondeu. Tente de novo em instantes."; return; }

  const pts = itens.map(el=>{
    const pos = el.type==="node" ? [el.lat,el.lon] : [el.center.lat,el.center.lon];
    const t = el.tags||{};
    const end = [t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(", ");
    return {pos, nome:t.name||t.brand||"Farmácia sem nome", end, rede:ehRede(t), d:distancia(centro,pos)};
  }).sort((a,b)=>a.d-b.d);

  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  let nI=0,nR=0;
  pts.forEach(p=>{
    p.rede ? nR++ : nI++;
    const c = p.rede ? cor("--rede") : cor("--indep");
    const m = L.circleMarker(p.pos,{radius:p.rede?6:8,color:c,fillColor:c,fillOpacity:.85,weight:1})
      .bindPopup(`<b>${p.nome}</b><br>${p.end||"Endereço não informado"}<br>${Math.round(p.d)} m · ${p.rede?"rede":"independente"}`)
      .addTo(camada);
    const li = document.createElement("li");
    li.tabIndex = 0;
    li.innerHTML = `<span class="pt" style="background:${c}"></span>
      <div><div class="nome"></div><div class="end"></div></div><span class="dist">${Math.round(p.d)} m</span>`;
    li.querySelector(".nome").textContent = p.nome;
    li.querySelector(".end").textContent = p.end || "Endereço não informado";
    li.onclick = ()=>{ mapa.setView(p.pos,17); m.openPopup(); };
    li.onkeydown = e=>{ if(e.key==="Enter") li.onclick(); };
    lista.appendChild(li);
  });
  document.getElementById("cTotal").textContent = pts.length;
  document.getElementById("cIndep").textContent = nI;
  document.getElementById("cRede").textContent = nR;
  document.getElementById("estado").textContent = pts.length
    ? `${pts.length} farmácias em ${raio>=1000?raio/1000+" km":raio+" m"}, da mais próxima à mais distante.`
    : "Nenhuma farmácia cadastrada no OpenStreetMap neste raio.";
}

document.querySelectorAll(".raios button").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".raios button").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    raio = +b.dataset.r;
    atualizar();
  };
});
mapa.on("click", e=>{ centro=[e.latlng.lat,e.latlng.lng]; atualizar(); });

atualizar();
</script>
</body>
</html>
